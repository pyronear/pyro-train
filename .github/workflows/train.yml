name: Train on GPU

on:
  push:
    branches:
      - "train_*"

# Both the model pointer and the results are force-pushed to the same
# result branch, so two overlapping runs on one train_* branch let the
# slower, older one overwrite the newer. Superseding also frees the GPU
# instance the abandoned run would keep for hours.
concurrency:
  group: train-${{ github.ref }}
  cancel-in-progress: true

jobs:
  start-runner:
    name: Start EC2 GPU runner
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.start-ec2-runner.outputs.label }}
      ec2-instance-id: ${{ steps.start-ec2-runner.outputs.ec2-instance-id }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3

      - name: Start EC2 runner
        id: start-ec2-runner
        uses: machulav/ec2-github-runner@v2
        with:
          mode: start
          github-token: ${{ secrets.GH_PAT }}
          ec2-image-id: ami-078da566f22c68a26
          ec2-instance-type: g4dn.xlarge
          subnet-id: subnet-0ed91f5fc60959086
          security-group-id: sg-05cd9ff586699e8db
  train:
    name: Run training
    needs: start-runner
    runs-on: ${{ needs.start-runner.outputs.label }}
    timeout-minutes: 1440
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3

      - name: Install dependencies
        run: uv sync

      # Train first and push the weights immediately. The runner is ephemeral,
      # so anything not in the remote when the job ends is gone — and the
      # stages after training are the fragile ones: minutes of grid search and
      # export, against ten hours of GPU that depend only on data already on
      # disk. Pushing between the two stops a late failure from destroying the
      # model, which is what happened on 2026-09-07: train_yolo_best succeeded
      # twice, and both models died with the runner.
      - name: Train
        run: uv run dvc repro train_yolo_best

      - name: Push the trained model to DVC remote
        run: uv run dvc push

      # The blob is content-addressed, so uploading it is not enough: without
      # the dvc.lock that names its hash, nobody can find it again. Publish the
      # pointer here too, or a later failure leaves the weights in S3 with no
      # way to reach them, and the next run retrains from scratch anyway.
      - name: Publish the model pointer to the result branch
        run: |
          RESULT_BRANCH="result_${GITHUB_REF_NAME#train_}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -B "$RESULT_BRANCH"
          git add dvc.lock
          # Empty when train_yolo_best was cached and dvc.lock already
          # recorded this hash; git treats that as an error.
          git diff --cached --quiet || git commit -m "chore: trained model from $GITHUB_REF_NAME [skip ci]"
          git push --force origin "$RESULT_BRANCH"

      - name: Run the rest of the pipeline
        run: uv run dvc repro

      - name: Push artifacts to DVC remote
        run: uv run dvc push

      - name: Push results to result branch
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME}"
          RESULT_BRANCH="result_${BRANCH_NAME#train_}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -B "$RESULT_BRANCH"
          git add dvc.lock
          # The model pointer was already committed above, so this sees only
          # what the remaining stages added — nothing at all when they were
          # all cached, and `git commit` treats an empty diff as an error.
          git diff --cached --quiet || git commit -m "chore: training results from $BRANCH_NAME [skip ci]"
          git push --force origin "$RESULT_BRANCH"

      - name: Download test dataset
        run: |
          uv run dvc get https://github.com/pyronear/pyro-dataset \
            data/processed/yolo_test_corrected --rev v4.0.0-corrected \
            --out ./data/test/yolo_test

      - name: Run evaluation
        run: |
          uv run python ./scripts/model/yolo/evaluate.py \
            --model-dir ./data/02_models/yolo/best \
            --data ./data/test/yolo_test/data.yaml \
            --output-dir ./data/03_reporting/yolo/eval/ \
            --split test \
            --iou 0.01 \
            --loglevel info

      - name: Download sequential test dataset
        run: |
          uv run dvc get https://github.com/pyronear/pyro-dataset \
            data/processed/sequential_test --rev v4.0.0-corrected \
            --out ./data/test/sequential_test

      - name: Run sequential predictions on test
        run: |
          uv run python predict_sequential.py \
            --model-path ./data/02_models/yolo/best/weights/best.pt \
            --data-dir ./data/test/sequential_test/test \
            --labels-dir ./data/03_reporting/sequential/predictions_labels_test

      - name: Run sequential evaluation on test with optimized params
        run: |
          NB_FRAMES=$(tail -n +2 ./data/03_reporting/sequential/grid_search_val.tsv | head -1 | cut -f1)
          CONF_THRESH=$(tail -n +2 ./data/03_reporting/sequential/grid_search_val.tsv | head -1 | cut -f2)
          echo "Using nb_consecutive_frames=$NB_FRAMES conf_thresh=$CONF_THRESH"
          uv run python copy_failures.py \
            --labels-dir ./data/03_reporting/sequential/predictions_labels_test \
            --data-dir ./data/test/sequential_test/test \
            --output-dir ./data/03_reporting/sequential/failures_test \
            --nb-consecutive-frames "$NB_FRAMES" \
            --conf-thresh "$CONF_THRESH" \
            --min-frames 8 \
            --output-json ./data/03_reporting/yolo/sequential/eval/eval_sequential_results.json

      - name: Commit eval results to result branch
        run: |
          RESULT_BRANCH="result_${GITHUB_REF_NAME#train_}"
          mkdir -p results
          cp ./data/03_reporting/yolo/eval/eval_results.json results/eval_results.json
          cp ./data/03_reporting/yolo/sequential/eval/eval_sequential_results.json results/eval_sequential_results.json
          git add results/eval_results.json results/eval_sequential_results.json
          git commit -m "chore: add eval results [skip ci]"
          git push origin "$RESULT_BRANCH"

      - name: Install gh CLI
        run: |
          if ! which gh > /dev/null 2>&1; then
            sudo mkdir -p -m 755 /etc/apt/keyrings
            wget -qO- https://cli.github.com/packages/githubcli-archive-keyring.gpg \
              | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null
            sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
              | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt-get update -qq
            sudo apt-get install -y gh
          fi

      - name: Open PR and publish metrics
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          export RESULT_BRANCH="result_${GITHUB_REF_NAME#train_}"
          export RESULTS=./data/03_reporting/yolo/eval/eval_results.json
          export SEQ_RESULTS=./data/03_reporting/yolo/sequential/eval/eval_sequential_results.json
          export OPT_RESULTS=./data/03_reporting/sequential/grid_search_val.tsv

          # Fetch baseline results from main (may not exist on first run)
          git fetch origin main --depth=1 2>/dev/null || true
          export BASELINE_JSON=$(git show origin/main:results/eval_results.json 2>/dev/null || echo "{}")
          export BASELINE_SEQ_JSON=$(git show origin/main:results/eval_sequential_results.json 2>/dev/null || echo "{}")

          BODY=$(uv run python - <<'PYEOF'
          import json, os, csv

          with open(os.environ["RESULTS"]) as f:
              curr = json.load(f)
          with open(os.environ["SEQ_RESULTS"]) as f:
              seq = json.load(f)

          baseline_json = os.environ.get("BASELINE_JSON", "{}")
          prev = json.loads(baseline_json) if baseline_json.strip() != "{}" else None

          baseline_seq_json = os.environ.get("BASELINE_SEQ_JSON", "{}")
          prev_seq = json.loads(baseline_seq_json) if baseline_seq_json.strip() != "{}" else None

          # Load top 10 optimization results
          opt_rows = []
          opt_path = os.environ.get("OPT_RESULTS", "")
          if opt_path and os.path.exists(opt_path):
              with open(opt_path) as f:
                  reader = csv.DictReader(f, delimiter="\t")
                  for i, row in enumerate(reader):
                      if i >= 10:
                          break
                      opt_rows.append(row)

          def fmt(v):
              import math
              return f"{v:.4f}" if v is not None and not (isinstance(v, float) and math.isnan(v)) else "N/A"

          def delta(curr_val, prev_val):
              if prev_val is None or curr_val is None:
                  return "n/a"
              d = curr_val - prev_val
              return f"{'+'if d>=0 else ''}{d:.4f}"

          metrics = [
              ("mAP@50",    "map50"),
              ("mAP@50-95", "map50_95"),
              ("Precision", "precision"),
              ("Recall",    "recall"),
          ]
          rows = "\n".join(
              f"| {label} | {fmt(prev[key]) if prev and key in prev else 'n/a'} | {fmt(curr[key])} | {delta(curr[key], prev[key] if prev else None)} |"
              for label, key in metrics
          )

          seq_metrics = [
              ("Recall (TP rate)", "recall"),
              ("FPR",              "fpr"),
              ("F1",               "f1"),
              ("Precision",        "precision"),
          ]
          seq_rows = "\n".join(
              f"| {label} | {fmt(prev_seq[key]) if prev_seq and key in prev_seq else 'n/a'} | {fmt(seq[key])} | {delta(seq[key], prev_seq[key] if prev_seq else None)} |"
              for label, key in seq_metrics
          )
          tp, fn, fp, tn = seq["tp"], seq["fn"], seq["fp"], seq["tn"]

          opt_table = ""
          if opt_rows:
              opt_table = "## Engine parameter optimization (top 10 on val)\n\n"
              opt_table += "| nb_frames | conf | TP | FN | FP | TN | Recall | FPR | F1 |\n"
              opt_table += "|-----------|------|----|----|----|----|--------|-----|----|\n"
              opt_table += "\n".join(
                  f"| {r['nb_consecutive_frames']} | {r['conf_thresh']} | {r['tp']} | {r['fn']} | {r['fp']} | {r['tn']} | {r['recall']} | {r['fpr']} | {r['f1']} |"
                  for r in opt_rows
              )

          baseline_note = "_(no baseline on main yet)_" if prev is None else "_(vs last committed results on main)_"

          print(f"""## Evaluation results on test set

          | Metric | main | current | Δ |
          |--------|------|---------|---|
          {rows}

          ## Sequential evaluation on test (optimized params: nb_frames={seq.get('nb_consecutive_frames', 'n/a')}, conf={seq.get('conf_thresh', 'n/a')})

          TP={tp} FN={fn} FP={fp} TN={tn}

          | Metric | main | current | Δ |
          |--------|------|---------|---|
          {seq_rows}

          {opt_table}

          {baseline_note}
          **Branch:** `{os.environ.get('RESULT_BRANCH', '')}` | **Test dataset:** pyronear/pyro-dataset @ v4.0.0-corrected""")
          PYEOF
          )

          PR_NUMBER=$(gh pr list --head "$RESULT_BRANCH" --base main --json number --jq '.[0].number')

          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            gh pr create \
              --base main \
              --head "$RESULT_BRANCH" \
              --title "Training results: $RESULT_BRANCH" \
              --body "$BODY"
          else
            gh pr comment "$PR_NUMBER" --body "$BODY"
          fi

  stop-runner:
    name: Stop EC2 GPU runner
    needs: [start-runner, train]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3

      - name: Stop EC2 runner
        uses: machulav/ec2-github-runner@v2
        with:
          mode: stop
          github-token: ${{ secrets.GH_PAT }}
          label: ${{ needs.start-runner.outputs.label }}
          ec2-instance-id: ${{ needs.start-runner.outputs.ec2-instance-id }}
